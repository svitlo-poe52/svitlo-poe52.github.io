<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Світло · Plaster</title>
<script src="../../shared/theme.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,200;0,300;0,400;1,300&display=swap">
<link rel="stylesheet" href="../../shared/paper.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wall" aria-hidden="true">
  <div class="relief" data-relief></div>
  <div class="relief" data-relief></div>
  <div class="pool"></div>
</div>
<div class="grain"></div>

<header class="head">
  <span class="sc">Світло — черга <span data-queue></span></span>
  <button type="button" data-theme-toggle>Тема ( <span data-theme-label>світла</span> )</button>
</header>

<section class="hero" data-hero>
  <p class="kicker" data-kicker>Завантаження</p>
  <p class="count" data-count aria-live="polite"></p>
  <p class="line" data-line></p>
</section>

<section class="sheet">
  <div class="days" data-days></div>
  <ul class="notes" data-notes></ul>
  <footer class="foot"><span>Графік від <span data-update>—</span></span><a href="../">Інші демки</a></footer>
</section>

<script type="module" src="main.js"></script>
</body>
</html>
