<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Світло · Tissue</title>
<script src="../../shared/theme.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,200..500;1,7..72,300&family=IBM+Plex+Mono:wght@400&display=swap">
<link rel="stylesheet" href="../../shared/paper.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="grain"></div>

<main class="page">
  <header class="bar">
    <span>Світло · черга <span data-queue></span></span>
    <button type="button" data-theme-toggle>( <span data-theme-label>світла</span> )</button>
  </header>

  <section class="hero" data-hero>
    <div class="print">
      <p class="kicker"><i class="dot"></i><span data-kicker>завантаження</span></p>
      <p class="count" aria-live="polite">
        <span class="num" data-h>—</span><span class="unit">год</span>
        <span class="num" data-m>—</span><span class="unit">хв</span>
      </p>
      <p class="line" data-line></p>
    </div>
    <div class="tissue" data-tissue aria-hidden="true">
      <span class="tissue-side">Час, що минув · черга <span data-queue></span></span>
      <span class="tissue-edge" data-elapsed></span>
    </div>
  </section>

  <section class="days" data-days></section>

  <ul class="notes" data-notes></ul>
  <footer class="foot"><span>Графік від <span data-update>—</span></span><a href="../">Інші демки</a></footer>
</main>

<script type="module" src="main.js"></script>
</body>
</html>
