<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Світло · Glow</title>
<script src="../../shared/theme.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;1,400&family=PT+Mono&display=swap">
<link rel="stylesheet" href="../../shared/paper.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas class="field" width="16" height="12" data-field aria-hidden="true"></canvas>
<div class="grain"></div>

<header class="head">
  <span>Світло, черга <span data-queue></span></span>
  <button type="button" data-theme-toggle>Тема ( <span data-theme-label>світла</span> )</button>
</header>

<main class="main">
  <p class="lede" data-lede>Завантажую графік…</p>
  <p class="count" data-count aria-live="polite"></p>
</main>

<aside class="panel" data-panel>
  <div class="panel-row"><span data-today>—</span><span>Графік від <span data-update>—</span></span></div>
  <div data-days></div>
  <ul class="notes" data-notes></ul>
  <div class="panel-row foot"><span>Дані: Полтаваобленерго</span><a href="../">Інші демки</a></div>
</aside>

<script type="module" src="main.js"></script>
</body>
</html>
