<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Світло · Filament</title>
<script src="../../shared/theme.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Variable digits only: the text= subset keeps the big font file tiny. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wdth,wght@8..144,25..151,100..1000&text=0123456789%E2%80%94&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400&family=IBM+Plex+Sans:wght@300;400&display=swap">
<link rel="stylesheet" href="../../shared/paper.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="pulp"></div>
<div class="grain"></div>

<main class="page">
  <header class="bar">
    <span>Черга <span data-queue></span></span>
    <span data-today>—</span>
    <span>Графік від <span data-update>—</span></span>
    <button type="button" data-theme-toggle>Тема: <span data-theme-label>світла</span></button>
  </header>

  <section class="hero instant" data-hero>
    <p class="kicker"><span data-kicker>завантаження</span> <span class="at" data-at></span></p>
    <p class="count" data-count aria-live="polite">
      <span class="num" data-h>—</span><span class="unit">год</span>
      <span class="num" data-m>—</span><span class="unit">хв</span>
    </p>
    <p class="line" data-line></p>
  </section>

  <section class="days" data-days></section>

  <ul class="notes" data-notes></ul>
  <footer class="foot"><span>Товщина лінії — це світло</span><a href="../">Інші демки</a></footer>
</main>

<script type="module" src="main.js"></script>
</body>
</html>
