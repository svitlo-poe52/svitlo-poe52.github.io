<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Світло · Xerox Moon</title>
<script src="../../shared/theme.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400&family=Commissioner:wght@200;300&display=swap">
<link rel="stylesheet" href="../../shared/paper.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="grain"></div>

<main class="frame">
  <div class="topline"><span>Черга <span data-queue></span></span><button type="button" data-theme-toggle data-light-label="день" data-dark-label="ніч">Тема: <span data-theme-label>день</span></button></div>
  <h1 class="spaced"><span>С</span><span>В</span><span>І</span><span>Т</span><span>Л</span><span>О</span></h1>

  <section class="cols">
    <div class="col col-moon">
      <canvas class="moon" data-moon aria-hidden="true"></canvas>
      <p class="caption" data-caption>ЗАВАНТАЖЕННЯ…</p>
    </div>

    <div class="col col-text">
      <h2>Що зараз?</h2>
      <p data-line>—</p>
      <h2>Як читати місяць?</h2>
      <p>Повний диск — світло є. Він убуває, поки наближається вимкнення, і росте знову, коли до увімкнення лишається менше. Тремтливий растр — час на перемикання.</p>
      <h2>Відключення</h2>
      <div data-periods></div>
      <ul class="notes" data-notes></ul>
    </div>

    <div class="col col-days" data-days></div>
  </section>

  <h1 class="spaced bottom"><span>Ч</span><span>Е</span><span>Р</span><span>Г</span><span>А</span><span data-queue-big></span></h1>
  <div class="bottomline"><span>Графік від <span data-update>—</span></span><a href="../">Інші демки</a></div>
</main>

<script type="module" src="main.js"></script>
</body>
</html>
